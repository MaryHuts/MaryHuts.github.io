<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaryHuts — Interactive AI Tools Hub</title>
    <style>
        :root {
            --bg-color: #0b0d17;
            --card-bg: rgba(22, 27, 46, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-purple: #a855f7;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
        }

        header {
            text-align: center;
            max-width: 800px;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.5;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.7rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: #fff;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        /* App Frame Container */
        .app-container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            min-height: 700px;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 750px;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }

        footer {
            margin-top: 3rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>MaryHuts Studio</h1>
        <p>Select a tool below to launch and interact with it directly on the page.</p>
    </header>

    <!-- App Navigation Tabs -->
    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchApp('postcraft', event)">
            <span>🎭</span> Persona Post AI
        </button>
        <button class="tab-btn" onclick="switchApp('stylemorph', event)">
            <span>🎨</span> StyleMorph AI
        </button>
        <button class="tab-btn" onclick="switchApp('savewise', event)">
            <span>📈</span> SaveWise AI
        </button>
    </nav>

    <!-- App Viewport Container -->
    <main class="app-container">
        <!-- REPLACE THE SRC URLS WITH YOUR ACTUAL PUBLISHED LOVABLE APP LINKS -->
        <iframe id="app-postcraft" class="active" src="https://text-morph-pal.lovable.app" title="Persona Post AI"></iframe>
        <iframe id="app-stylemorph" src="https://stylemorph-artify.lovable.app" title="StyleMorph AI"></iframe>
        <iframe id="app-savewise" src="https://wise-ai-planner.lovable.app" title="SaveWise AI"></iframe>
    </main>

    <footer>
        <p>&copy; 2026 MaryHuts. Powered by Cloudflare Workers & Google Gemini API.</p>
    </footer>

    <script>
        function switchApp(appId, evt) {
            // Hide all iframes
            document.querySelectorAll('iframe').forEach(iframe => {
                iframe.classList.remove('active');
            });

            // Deactivate all tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected iframe
            const selectedIframe = document.getElementById('app-' + appId);
            if (selectedIframe) {
                selectedIframe.classList.add('active');
            }

            // Highlight clicked tab button
            if (evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }
        }
    </script>

</body>
</html>
